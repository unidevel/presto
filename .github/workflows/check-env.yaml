name: Java Environment Check

on:
  push:
  workflow_dispatch:

jobs:
  check-java:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java environment
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "PATH=$PATH"
          env
